<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registro - HelpDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="auth-body">

<div class="auth-card" style="max-width: 500px;">

    <div class="auth-brand">
        <i class="bi bi-ticket-perforated-fill"></i>
        <span>HelpDesk</span>
    </div>

    <div class="card">

        <div class="card-body p-4">

            <h2 class="text-center mb-4">
                Registro de Usuario
            </h2>

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <form th:action="@{/registro}"
                  th:object="${usuario}"
                  method="post">

                <div class="mb-3">
                    <label>Nombres</label>

                    <input type="text"
                           th:field="*{nombres}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Apellidos</label>

                    <input type="text"
                           th:field="*{apellidos}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Correo</label>

                    <input type="email"
                           th:field="*{correo}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Contraseña</label>

                    <input type="password"
                           th:field="*{password}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Rol</label>

                    <select class="form-select" disabled>
                        <option selected>
                            Usuario
                        </option>
                    </select>
                </div>

                <button type="submit"
                        class="btn btn-primary w-100">
                    Registrarse
                </button>

                <a th:href="@{/login}"
                   class="btn btn-outline-secondary w-100 mt-2">
                    Volver al Login
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
