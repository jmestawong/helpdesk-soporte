<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registro - HelpDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5" style="max-width: 500px;">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">
                Registro de Usuario
            </h2>

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <form th:action="@{/registro}"
                  th:object="${usuario}"
                  method="post">

                <div class="mb-3">
                    <label>Nombres</label>

                    <input type="text"
                           th:field="*{nombres}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Apellidos</label>

                    <input type="text"
                           th:field="*{apellidos}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Correo</label>

                    <input type="email"
                           th:field="*{correo}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Contraseña</label>

                    <input type="password"
                           th:field="*{password}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Rol</label>

                    <select class="form-select" disabled>
                        <option selected>
                            Usuario
                        </option>
                    </select>
                </div>

                <button type="submit"
                        class="btn btn-success w-100">
                    Registrarse
                </button>

                <a th:href="@{/login}"
                   class="btn btn-secondary w-100 mt-2">
                    Volver al Login
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
