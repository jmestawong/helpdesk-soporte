<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Preguntas Frecuentes</title>

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">

<div class="app-layout">

    <div th:replace="~{fragments/nav :: sidebar(${activo})}"></div>

    <div class="app-content">

        <div th:replace="~{fragments/nav :: topbar}"></div>

        <main class="page-content">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">Consulta / Preguntas Frecuentes</h2>

                <a th:href="@{/preguntas-frecuentes/nuevo}"
                   class="btn btn-primary"
                   sec:authorize="hasAnyRole('ADMINISTRADOR','TECNICO')">
                    Nueva Pregunta
                </a>
            </div>

            <p class="text-secondary mb-4">
                Respuestas a las consultas más comunes antes de registrar un ticket o requerimiento.
            </p>

            <div class="accordion" id="faqAccordion">

                <div class="accordion-item" th:each="p, iter : ${preguntas}">

                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed"
                                type="button"
                                data-bs-toggle="collapse"
                                th:data-bs-target="${'#faq' + p.idPregunta}"
                                th:text="${p.pregunta}">
                        </button>
                    </h2>

                    <div th:id="${'faq' + p.idPregunta}"
                         class="accordion-collapse collapse"
                         data-bs-parent="#faqAccordion">
                        <div class="accordion-body">

                            <p style="white-space: pre-line;" th:text="${p.respuesta}"></p>

                            <div sec:authorize="hasAnyRole('ADMINISTRADOR','TECNICO')" class="d-flex gap-2">
                                <a th:href="@{/preguntas-frecuentes/editar/{id}(id=${p.idPregunta})}"
                                   class="btn btn-outline-primary btn-sm">
                                    Editar
                                </a>
                                <a th:href="@{/preguntas-frecuentes/eliminar/{id}(id=${p.idPregunta})}"
                                   class="btn btn-outline-danger btn-sm"
                                   onclick="return confirm('¿Desea eliminar esta pregunta?')">
                                    Eliminar
                                </a>
                            </div>

                        </div>
                    </div>

                </div>

                <p th:if="${#lists.isEmpty(preguntas)}" class="text-secondary">
                    Todavía no hay preguntas registradas.
                </p>

            </div>

        </main>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>

</body>
</html>
