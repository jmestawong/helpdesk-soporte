<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Pregunta Frecuente</title>

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">

<div class="app-layout">

    <div th:replace="~{fragments/nav :: sidebar(${activo})}"></div>

    <div class="app-content">

        <div th:replace="~{fragments/nav :: topbar}"></div>

        <main class="page-content">

            <h2>Pregunta Frecuente</h2>

            <div class="card" style="max-width: 720px;">
                <div class="card-body">

                    <form th:action="@{/preguntas-frecuentes/guardar}" th:object="${pregunta}" method="post">

                        <input type="hidden" th:field="*{idPregunta}">

                        <div class="mb-3">
                            <label>Pregunta</label>
                            <input type="text" th:field="*{pregunta}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Respuesta</label>
                            <textarea th:field="*{respuesta}" class="form-control" rows="6" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Guardar
                        </button>

                        <a th:href="@{/preguntas-frecuentes}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                    </form>

                </div>
            </div>

        </main>

    </div>

</div>

</body>
</html>
