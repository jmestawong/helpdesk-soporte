<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Tickets</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>Gestión de Tickets</h2>

    <div class="d-flex gap-2 mb-3">

        <a th:href="@{/}"
           class="btn btn-secondary">
            Volver
        </a>

        <a th:href="@{/tickets/nuevo}"
           class="btn btn-primary">
            Nuevo Ticket
        </a>

    </div>

    <!-- Buscador -->
    <form th:action="@{/tickets/buscar}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" name="titulo" class="form-control" placeholder="Buscar por título">
            <button type="submit" class="btn btn-success">Buscar</button>
        </div>
    </form>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Código</th>
            <th>Título</th>
            <th>Usuario</th>
            <th>Categoría</th>
            <th>Prioridad</th>
            <th>Estado</th>
            <th>Fecha</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="ticket : ${tickets}">
            <td th:text="${ticket.idTicket}"></td>
            <td th:text="${ticket.codigoTicket}"></td>
            <td th:text="${ticket.titulo}"></td>
            <td th:text="${ticket.usuario.nombres}"></td>
            <td th:text="${ticket.categoria.nombreCategoria}"></td>
            <td th:text="${ticket.prioridad.nombrePrioridad}"></td>
            <td th:text="${ticket.estado.nombreEstado}"></td>
            <td th:text="${ticket.fechaRegistro}"></td>

            <td>
                <a th:href="@{/tickets/editar/{id}(id=${ticket.idTicket})}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a th:href="@{/tickets/eliminar/{id}(id=${ticket.idTicket})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Desea eliminar este ticket?')">
                    Eliminar
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
