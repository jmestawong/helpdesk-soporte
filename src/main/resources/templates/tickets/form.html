<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Ticket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>Formulario Ticket</h2>

    <form th:action="@{/tickets/guardar}" th:object="${ticket}" method="post">

        <input type="hidden" th:field="*{idTicket}">

        <div class="mb-3">
            <label>Código</label>
            <input type="text" th:field="*{codigoTicket}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Título</label>
            <input type="text" th:field="*{titulo}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Descripción</label>
            <textarea th:field="*{descripcion}" class="form-control"></textarea>
        </div>

        <!-- Usuario -->
        <div class="mb-3">
            <label>Usuario</label>
            <select th:field="*{usuario}" class="form-control">
                <option th:each="u : ${usuarios}"
                        th:value="${u.idUsuario}"
                        th:text="${u.nombres}">
                </option>
            </select>
        </div>

        <!-- Categoria -->
        <div class="mb-3">
            <label>Categoría</label>
            <select th:field="*{categoria}" class="form-control">
                <option th:each="c : ${categorias}"
                        th:value="${c.idCategoria}"
                        th:text="${c.nombreCategoria}">
                </option>
            </select>
        </div>

        <!-- Prioridad -->
        <div class="mb-3">
            <label>Prioridad</label>
            <select th:field="*{prioridad}" class="form-control">
                <option th:each="p : ${prioridades}"
                        th:value="${p.idPrioridad}"
                        th:text="${p.nombrePrioridad}">
                </option>
            </select>
        </div>

        <!-- Estado -->
        <div class="mb-3">
            <label>Estado</label>
            <select th:field="*{estado}" class="form-control">
                <option th:each="e : ${estados}"
                        th:value="${e.idEstado}"
                        th:text="${e.nombreEstado}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">
            Guardar
        </button>

        <a th:href="@{/tickets}" class="btn btn-secondary">
            Volver
        </a>

    </form>

</div>

</body>
</html>
