<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Artículo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>Formulario Artículo</h2>

    <form th:action="@{/base-conocimiento/guardar}" th:object="${articulo}" method="post">

        <input type="hidden" th:field="*{idArticulo}">

        <div class="mb-3">
            <label>Título</label>
            <input type="text" th:field="*{titulo}" class="form-control">
        </div>

        <div class="mb-3">
            <label>Contenido</label>
            <textarea th:field="*{contenido}" class="form-control" rows="10"></textarea>
        </div>

        <!-- Categoria -->
        <div class="mb-3">
            <label>Categoría</label>
            <select th:field="*{categoria}" class="form-control">
                <option value="">Sin categoría</option>
                <option th:each="c : ${categorias}"
                        th:value="${c.idCategoria}"
                        th:text="${c.nombreCategoria}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">
            Guardar
        </button>

        <a th:href="@{/base-conocimiento}" class="btn btn-secondary">
            Volver
        </a>

    </form>

</div>

</body>
</html>
