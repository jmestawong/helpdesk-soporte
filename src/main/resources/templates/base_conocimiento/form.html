<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Artículo</title>

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">

<div class="app-layout">

    <div th:replace="~{fragments/nav :: sidebar(${activo})}"></div>

    <div class="app-content">

        <div th:replace="~{fragments/nav :: topbar}"></div>

        <main class="page-content">

            <h2>Formulario Artículo</h2>

            <div class="card " style="max-width: 720px;">
                <div class="card-body">

                    <form th:action="@{/base-conocimiento/guardar}" th:object="${articulo}" method="post">

                        <input type="hidden" th:field="*{idArticulo}">

                        <div class="mb-3">
                            <label>Título</label>
                            <input type="text" th:field="*{titulo}" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Contenido</label>
                            <textarea th:field="*{contenido}" class="form-control" rows="10"></textarea>
                        </div>

                        <!-- Categoria -->
                        <div class="mb-3">
                            <label>Categoría</label>
                            <select th:field="*{categoria}" class="form-select">
                                <option value="">Sin categoría</option>
                                <option th:each="c : ${categorias}"
                                        th:value="${c.idCategoria}"
                                        th:text="${c.nombreCategoria}">
                                </option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Guardar
                        </button>

                        <a th:href="@{/base-conocimiento}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                    </form>

                </div>
            </div>

        </main>

    </div>

</div>

</body>
</html>
