<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Base de Conocimiento</title>

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">

<div class="app-layout">

    <div th:replace="~{fragments/nav :: sidebar(${activo})}"></div>

    <div class="app-content">

        <div th:replace="~{fragments/nav :: topbar}"></div>

        <main class="page-content">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">Base de Conocimiento</h2>

                <a th:href="@{/base-conocimiento/nuevo}"
                   class="btn btn-primary">
                    Nuevo Artículo
                </a>
            </div>

            <!-- Buscador -->
            <form th:action="@{/base-conocimiento/buscar}" method="get" class="mb-3">
                <div class="input-group">
                    <input type="text" name="texto" class="form-control" placeholder="Buscar por título o contenido">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                </div>
            </form>

            <div class="card ">
                <div class="card-body table-responsive">

                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Categoría</th>
                            <th>Autor</th>
                            <th>Última actualización</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="articulo : ${articulos}">
                            <td th:text="${articulo.idArticulo}"></td>
                            <td th:text="${articulo.titulo}"></td>
                            <td th:text="${articulo.categoria != null ? articulo.categoria.nombreCategoria : '-'}"></td>
                            <td th:text="${articulo.autor != null ? articulo.autor.nombres : '-'}"></td>
                            <td th:text="${articulo.fechaActualizacion}"></td>

                            <td>
                                <a th:href="@{/base-conocimiento/{id}(id=${articulo.idArticulo})}"
                                   class="btn btn-outline-secondary btn-sm">
                                    Ver
                                </a>

                                <a th:href="@{/base-conocimiento/editar/{id}(id=${articulo.idArticulo})}"
                                   class="btn btn-outline-primary btn-sm">
                                    Editar
                                </a>

                                <a th:href="@{/base-conocimiento/eliminar/{id}(id=${articulo.idArticulo})}"
                                   class="btn btn-outline-danger btn-sm"
                                   onclick="return confirm('¿Desea eliminar este artículo?')">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                </div>
            </div>

        </main>

    </div>

</div>

</body>
</html>
