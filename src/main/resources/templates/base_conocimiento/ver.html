<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Artículo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="d-flex gap-2 mb-3">
        <a th:href="@{/base-conocimiento}" class="btn btn-secondary">
            Volver
        </a>
        <a th:href="@{/base-conocimiento/editar/{id}(id=${articulo.idArticulo})}" class="btn btn-warning">
            Editar
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">

            <h2 th:text="${articulo.titulo}"></h2>

            <p class="text-muted">
                <span th:if="${articulo.categoria != null}">
                    Categoría: <strong th:text="${articulo.categoria.nombreCategoria}"></strong> &middot;
                </span>
                <span th:if="${articulo.autor != null}">
                    Autor: <strong th:text="${articulo.autor.nombres + ' ' + articulo.autor.apellidos}"></strong> &middot;
                </span>
                Actualizado: <span th:text="${articulo.fechaActualizacion}"></span>
            </p>

            <hr>

            <p style="white-space: pre-line;" th:text="${articulo.contenido}"></p>

        </div>
    </div>

</div>

</body>
</html>
