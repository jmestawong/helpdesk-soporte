<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Artículo</title>

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">

<div class="app-layout">

    <div th:replace="~{fragments/nav :: sidebar(${activo})}"></div>

    <div class="app-content">

        <div th:replace="~{fragments/nav :: topbar}"></div>

        <main class="page-content">

            <div class="d-flex gap-2 mb-3">
                <a th:href="@{/base-conocimiento}" class="btn btn-outline-secondary">
                    Volver
                </a>
                <a th:href="@{/base-conocimiento/editar/{id}(id=${articulo.idArticulo})}" class="btn btn-outline-primary">
                    Editar
                </a>
            </div>

            <div class="card ">
                <div class="card-body">

                    <h2 th:text="${articulo.titulo}"></h2>

                    <p class="text-muted">
                        <span th:if="${articulo.categoria != null}">
                            Categoría: <strong th:text="${articulo.categoria.nombreCategoria}"></strong> &middot;
                        </span>
                        <span th:if="${articulo.autor != null}">
                            Autor: <strong th:text="${articulo.autor.nombres + ' ' + articulo.autor.apellidos}"></strong> &middot;
                        </span>
                        Actualizado: <span th:text="${articulo.fechaActualizacion}"></span>
                    </p>

                    <hr>

                    <p style="white-space: pre-line;" th:text="${articulo.contenido}"></p>

                </div>
            </div>

        </main>

    </div>

</div>

</body>
</html>
