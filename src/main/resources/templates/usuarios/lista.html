<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>Gestión de Usuarios</h2>

    <a th:href="@{/}"
       class="btn btn-secondary mb-3">
        Volver
    </a>

    <a th:href="@{/usuarios/nuevo}"
       class="btn btn-success mb-3">
        Nuevo Usuario
    </a>

    <table class="table table-bordered table-striped">

        <thead>

        <tr>
            <th>ID</th>
            <th>Nombres</th>
            <th>Apellidos</th>
            <th>Correo</th>
            <th>Rol</th>
            <th>Acciones</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="u : ${usuarios}">

            <td th:text="${u.idUsuario}"></td>

            <td th:text="${u.nombres}"></td>

            <td th:text="${u.apellidos}"></td>

            <td th:text="${u.correo}"></td>

            <td th:text="${u.rol.nombreRol}"></td>

            <td>

                <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a th:href="@{/usuarios/eliminar/{id}(id=${u.idUsuario})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Eliminar usuario?')">
                    Eliminar
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
