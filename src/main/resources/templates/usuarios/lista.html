<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">

<div class="app-layout">

    <div th:replace="~{fragments/nav :: sidebar(${activo})}"></div>

    <div class="app-content">

        <div th:replace="~{fragments/nav :: topbar}"></div>

        <main class="page-content">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">Usuarios</h2>

                <a th:href="@{/usuarios/nuevo}"
                   class="btn btn-primary">
                    Nuevo Usuario
                </a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body table-responsive">

                    <table class="table table-bordered table-striped mb-0">

                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="u : ${usuarios}">

                            <td th:text="${u.idUsuario}"></td>

                            <td th:text="${u.nombres + ' ' + u.apellidos}"></td>

                            <td th:text="${u.correo}"></td>

                            <td>
                                <span class="badge"
                                      th:classappend="${'badge-rol-' + #strings.toLowerCase(u.rol.nombreRol)}"
                                      th:text="${u.rol.nombreRol}">
                                </span>
                            </td>

                            <td>
                                <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}"
                                   class="btn btn-outline-primary btn-sm">
                                    Editar
                                </a>

                                <a th:href="@{/usuarios/eliminar/{id}(id=${u.idUsuario})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('¿Eliminar usuario?')">
                                    Eliminar
                                </a>
                            </td>

                        </tr>
                        </tbody>

                    </table>

                </div>
            </div>

        </main>

    </div>

</div>

</body>
</html>
