<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">

<div class="app-layout">

    <div th:replace="~{fragments/nav :: sidebar(${activo})}"></div>

    <div class="app-content">

        <div th:replace="~{fragments/nav :: topbar}"></div>

        <main class="page-content">

            <h2>Usuario</h2>

            <div class="card shadow-sm" style="max-width: 560px;">
                <div class="card-body">

                    <form th:action="@{/usuarios/guardar}"
                          th:object="${usuario}"
                          method="post">

                        <input type="hidden"
                               th:field="*{idUsuario}">

                        <div class="mb-3">

                            <label>Nombres</label>

                            <input type="text"
                                   th:field="*{nombres}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label>Apellidos</label>

                            <input type="text"
                                   th:field="*{apellidos}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label>Correo</label>

                            <input type="email"
                                   th:field="*{correo}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label>Contraseña</label>

                            <input type="password"
                                   th:field="*{password}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label>Rol</label>

                            <select class="form-select"
                                    th:field="*{rol}">

                                <option
                                        th:each="r : ${roles}"
                                        th:value="${r.idRol}"
                                        th:text="${r.nombreRol}">
                                </option>

                            </select>

                        </div>

                        <button type="submit"
                                class="btn btn-primary">
                            Guardar
                        </button>

                        <a th:href="@{/usuarios}"
                           class="btn btn-secondary">
                            Cancelar
                        </a>

                    </form>

                </div>
            </div>

        </main>

    </div>

</div>

</body>
</html>
