<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>Usuario</h2>

    <form th:action="@{/usuarios/guardar}"
          th:object="${usuario}"
          method="post">

        <input type="hidden"
               th:field="*{idUsuario}">

        <div class="mb-3">

            <label>Nombres</label>

            <input type="text"
                   th:field="*{nombres}"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label>Apellidos</label>

            <input type="text"
                   th:field="*{apellidos}"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label>Correo</label>

            <input type="email"
                   th:field="*{correo}"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label>Contraseña</label>

            <input type="password"
                   th:field="*{password}"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label>Rol</label>

            <select class="form-select"
                    th:field="*{rol}">

                <option
                        th:each="r : ${roles}"
                        th:value="${r.idRol}"
                        th:text="${r.nombreRol}">
                </option>

            </select>

        </div>

        <button type="submit"
                class="btn btn-success">
            Guardar
        </button>

        <a th:href="@{/usuarios}"
           class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
