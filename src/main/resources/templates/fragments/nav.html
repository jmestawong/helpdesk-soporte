<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="sidebar(activo)" class="sidebar">

    <div class="sidebar-brand">
        <i class="bi bi-ticket-perforated-fill"></i>
        <span class="brand-text">HelpDesk</span>
    </div>

    <ul class="sidebar-nav">

        <li sec:authorize="hasAnyRole('ADMINISTRADOR','TECNICO')">
            <a class="nav-link" th:classappend="${activo == 'dashboard'} ? 'active'" th:href="@{/dashboard}">
                <i class="bi bi-speedometer2"></i>
                <span class="link-text">Dashboard</span>
            </a>
        </li>

        <li sec:authorize="hasAnyRole('ADMINISTRADOR','TECNICO')">
            <a class="nav-link" th:classappend="${activo == 'tickets'} ? 'active'" th:href="@{/tickets}">
                <i class="bi bi-pencil-square"></i>
                <span class="link-text">Tickets</span>
            </a>
        </li>

        <li sec:authorize="hasRole('USUARIO')">
            <a class="nav-link" th:classappend="${activo == 'mis-tickets'} ? 'active'" th:href="@{/tickets/mis-tickets}">
                <i class="bi bi-pencil-square"></i>
                <span class="link-text">Mis Tickets</span>
            </a>
        </li>

        <li>
            <a class="nav-link" th:classappend="${activo == 'nuevo-ticket'} ? 'active'" th:href="@{/tickets/nuevo}">
                <i class="bi bi-plus-circle"></i>
                <span class="link-text">Nuevo Ticket</span>
            </a>
        </li>

        <li sec:authorize="hasAnyRole('ADMINISTRADOR','TECNICO')">
            <a class="nav-link" th:classappend="${activo == 'requerimientos'} ? 'active'" th:href="@{/requerimientos}">
                <i class="bi bi-clipboard-check"></i>
                <span class="link-text">Requerimientos</span>
            </a>
        </li>

        <li sec:authorize="hasRole('USUARIO')">
            <a class="nav-link" th:classappend="${activo == 'mis-requerimientos'} ? 'active'" th:href="@{/requerimientos/mis-requerimientos}">
                <i class="bi bi-clipboard-check"></i>
                <span class="link-text">Mis Requerimientos</span>
            </a>
        </li>

        <li>
            <a class="nav-link" th:classappend="${activo == 'nuevo-requerimiento'} ? 'active'" th:href="@{/requerimientos/nuevo}">
                <i class="bi bi-clipboard-plus"></i>
                <span class="link-text">Nuevo Requerimiento</span>
            </a>
        </li>

        <li>
            <a class="nav-link" th:classappend="${activo == 'base-conocimiento'} ? 'active'" th:href="@{/base-conocimiento}">
                <i class="bi bi-journal-richtext"></i>
                <span class="link-text">Base de Conocimiento</span>
            </a>
        </li>

        <li>
            <a class="nav-link" th:classappend="${activo == 'preguntas-frecuentes'} ? 'active'" th:href="@{/preguntas-frecuentes}">
                <i class="bi bi-question-circle"></i>
                <span class="link-text">Preguntas Frecuentes</span>
            </a>
        </li>

        <li sec:authorize="hasRole('ADMINISTRADOR')">
            <a class="nav-link" th:classappend="${activo == 'usuarios'} ? 'active'" th:href="@{/usuarios}">
                <i class="bi bi-people"></i>
                <span class="link-text">Usuarios</span>
            </a>
        </li>

        <li>
            <a class="nav-link" th:classappend="${activo == 'perfil'} ? 'active'" th:href="@{/perfil}">
                <i class="bi bi-person-circle"></i>
                <span class="link-text">Perfil</span>
            </a>
        </li>

    </ul>

    <div class="sidebar-logout">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">
                <i class="bi bi-box-arrow-right"></i>
                <span class="link-text">Salir</span>
            </button>
        </form>
    </div>

</nav>

<header th:fragment="topbar" class="topbar">

    <form th:action="@{/tickets/buscar}" method="get" class="topbar-search"
          sec:authorize="hasAnyRole('ADMINISTRADOR','TECNICO')">
        <input type="text" name="titulo" class="form-control" placeholder="Buscar por título o ID...">
    </form>

    <div class="topbar-actions">
        <i class="bi bi-bell topbar-icon" title="Notificaciones"></i>

        <a th:href="@{/perfil}" class="user-avatar" th:if="${usuarioSesion != null}"
           th:text="${#strings.substring(usuarioSesion.nombres,0,1) + #strings.substring(usuarioSesion.apellidos,0,1)}">
        </a>
    </div>

</header>

</body>
</html>
