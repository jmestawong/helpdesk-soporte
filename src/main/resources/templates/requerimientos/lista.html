<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Requerimientos</title>

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">

<div class="app-layout">

    <div th:replace="~{fragments/nav :: sidebar(${activo})}"></div>

    <div class="app-content">

        <div th:replace="~{fragments/nav :: topbar}"></div>

        <main class="page-content">

            <h2>Solicitudes de Requerimiento</h2>

            <div class="d-flex gap-2 mb-3">

                <a th:href="@{/requerimientos/nuevo}"
                   class="btn btn-primary">
                    Nuevo Requerimiento
                </a>

            </div>

            <!-- Buscador -->
            <form th:action="@{/requerimientos/buscar}" method="get" class="mb-3">
                <div class="input-group">
                    <input type="text" name="titulo" class="form-control" placeholder="Buscar por título o ID">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                </div>
            </form>

            <!-- Filtro por categoría -->
            <form th:action="@{/requerimientos/filtrar}" method="get" class="mb-3">
                <div class="d-flex flex-wrap align-items-center gap-3">
                    <div class="form-check" th:each="c : ${categorias}">
                        <input type="checkbox"
                               name="categoriasSeleccionadas"
                               class="form-check-input"
                               th:id="${'cat' + c.idCategoria}"
                               th:value="${c.idCategoria}"
                               th:checked="${categoriasSeleccionadas != null and categoriasSeleccionadas.contains(c.idCategoria)}">
                        <label class="form-check-label"
                               th:for="${'cat' + c.idCategoria}"
                               th:text="${c.nombreCategoria}">
                        </label>
                    </div>
                    <button type="submit" class="btn btn-outline-secondary">Filtrar</button>
                    <a th:href="@{/requerimientos}" class="btn btn-outline-dark">Limpiar</a>
                </div>
            </form>

            <div class="card">
                <div class="card-body table-responsive">

                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Usuario</th>
                            <th>Categoría</th>
                            <th>Prioridad</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="r : ${requerimientos}">
                            <td th:text="${r.idRequerimiento}"></td>
                            <td th:text="${r.codigoRequerimiento}"></td>
                            <td th:text="${r.titulo}"></td>
                            <td th:text="${r.usuario.nombres}"></td>
                            <td th:text="${r.categoria.nombreCategoria}"></td>
                            <td><span class="badge" th:classappend="${'prioridad-' + #strings.toLowerCase(r.prioridad.nombrePrioridad)}" th:text="${r.prioridad.nombrePrioridad}"></span></td>
                            <td><span class="badge" th:classappend="${'estado-' + #strings.toLowerCase(#strings.replace(r.estado.nombreEstado,' ','-'))}" th:text="${r.estado.nombreEstado}"></span></td>
                            <td th:text="${r.fechaRegistro}"></td>

                            <td>
                                <a th:href="@{/requerimientos/editar/{id}(id=${r.idRequerimiento})}"
                                   class="btn btn-outline-primary btn-sm">
                                    Editar
                                </a>

                                <a th:href="@{/requerimientos/eliminar/{id}(id=${r.idRequerimiento})}"
                                   class="btn btn-outline-danger btn-sm"
                                   onclick="return confirm('¿Desea eliminar este requerimiento?')">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                </div>
            </div>

        </main>

    </div>

</div>

</body>
</html>
