<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Requerimiento</title>

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">

<div class="app-layout">

    <div th:replace="~{fragments/nav :: sidebar(${activo})}"></div>

    <div class="app-content">

        <div th:replace="~{fragments/nav :: topbar}"></div>

        <main class="page-content">

            <h2>Solicitud de Nuevo Requerimiento</h2>

            <div class="card" style="max-width: 720px;">
                <div class="card-body">

                    <form th:action="@{/requerimientos/guardar}" th:object="${requerimiento}" method="post">

                        <input type="hidden" th:field="*{idRequerimiento}">

                        <div class="mb-3">
                            <label>Código</label>
                            <input type="text" th:field="*{codigoRequerimiento}" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Título</label>
                            <input type="text" th:field="*{titulo}" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control" rows="4"></textarea>
                        </div>

                        <!-- Usuario -->
                        <div class="mb-3">
                            <label>Usuario</label>
                            <select th:field="*{usuario}" class="form-select">
                                <option th:each="u : ${usuarios}"
                                        th:value="${u.idUsuario}"
                                        th:text="${u.nombres}">
                                </option>
                            </select>
                        </div>

                        <!-- Categoria -->
                        <div class="mb-3">
                            <label>Categoría</label>
                            <select th:field="*{categoria}" class="form-select">
                                <option th:each="c : ${categorias}"
                                        th:value="${c.idCategoria}"
                                        th:text="${c.nombreCategoria}">
                                </option>
                            </select>
                        </div>

                        <!-- Prioridad -->
                        <div class="mb-3">
                            <label>Prioridad</label>
                            <select th:field="*{prioridad}" class="form-select">
                                <option th:each="p : ${prioridades}"
                                        th:value="${p.idPrioridad}"
                                        th:text="${p.nombrePrioridad}">
                                </option>
                            </select>
                        </div>

                        <!-- Estado -->
                        <div class="mb-3">
                            <label>Estado</label>
                            <select th:field="*{estado}" class="form-select">
                                <option th:each="e : ${estados}"
                                        th:value="${e.idEstado}"
                                        th:text="${e.nombreEstado}">
                                </option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Guardar Requerimiento
                        </button>

                        <a th:href="@{/requerimientos}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                    </form>

                </div>
            </div>

        </main>

    </div>

</div>

</body>
</html>
