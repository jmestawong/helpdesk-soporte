<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="app-body">

<div class="app-layout">

    <div th:replace="~{fragments/nav :: sidebar(${activo})}"></div>

    <div class="app-content">

        <div th:replace="~{fragments/nav :: topbar}"></div>

        <main class="page-content">

            <h2 class="mb-4">
                Dashboard de Tickets
            </h2>

            <form method="get"
                  th:action="@{/dashboard}"
                  class="dashboard-filtros">

                <div class="campo">
                    <label>Fecha Inicio</label>
                    <input type="date"
                           name="fechaInicio"
                           th:value="${fechaInicio}"
                           class="form-control">
                </div>

                <div class="campo">
                    <label>Fecha Fin</label>
                    <input type="date"
                           name="fechaFin"
                           th:value="${fechaFin}"
                           th:max="${hoy}"
                           class="form-control">
                </div>

                <button class="btn btn-primary">
                    Filtrar
                </button>

                <a th:href="@{/dashboard/pdf}"
                   class="btn btn-outline-secondary ms-auto">
                    <i class="bi bi-file-earmark-pdf"></i> Descargar Reporte PDF
                </a>

            </form>

            <div class="row">

                <div class="col-md-3">
                    <div class="card kpi-card kpi-total mb-3">
                        <div class="card-body">
                            <div class="kpi-label">Total Tickets</div>
                            <p class="kpi-valor" th:text="${totalTickets}"></p>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card kpi-card kpi-pendiente mb-3">
                        <div class="card-body">
                            <div class="kpi-label">Pendientes</div>
                            <p class="kpi-valor" th:text="${pendientes}"></p>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card kpi-card kpi-proceso mb-3">
                        <div class="card-body">
                            <div class="kpi-label">En Proceso</div>
                            <p class="kpi-valor" th:text="${proceso}"></p>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card kpi-card kpi-cerrado mb-3">
                        <div class="card-body">
                            <div class="kpi-label">Cerrados</div>
                            <p class="kpi-valor" th:text="${cerrados}"></p>
                        </div>
                    </div>
                </div>

            </div>

            <div class="row mt-4">

                <div class="col-md-6">

                    <div class="card">

                        <div class="card-header">
                            Tickets por Estado
                        </div>

                        <div class="card-body">
                            <div class="chart-box"><canvas id="pieChart"></canvas></div>
                        </div>

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="card">

                        <div class="card-header">
                            Tickets por Prioridad
                        </div>

                        <div class="card-body">
                            <div class="chart-box"><canvas id="barChart"></canvas></div>
                        </div>

                    </div>

                </div>

            </div>

            <div class="row mt-4">

                <div class="col-md-12">

                    <div class="card">

                        <div class="card-header">
                            Histograma de Tickets
                        </div>

                        <div class="card-body">
                            <div class="chart-box"><canvas id="histograma"></canvas></div>
                        </div>

                    </div>

                </div>

            </div>

            <div class="card mt-4">

                <div class="card-header">
                    Listado de Tickets
                </div>

                <div class="card-body">

                    <table class="table table-hover">

                        <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Usuario</th>
                            <th>Categoría</th>
                            <th>Prioridad</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="t : ${tickets}">

                            <td th:text="${t.codigoTicket}"></td>
                            <td th:text="${t.titulo}"></td>
                            <td th:text="${t.usuario.nombres}"></td>
                            <td th:text="${t.categoria.nombreCategoria}"></td>
                            <td><span class="badge" th:classappend="${'prioridad-' + #strings.toLowerCase(t.prioridad.nombrePrioridad)}" th:text="${t.prioridad.nombrePrioridad}"></span></td>
                            <td><span class="badge" th:classappend="${'estado-' + #strings.toLowerCase(#strings.replace(t.estado.nombreEstado,' ','-'))}" th:text="${t.estado.nombreEstado}"></span></td>
                            <td th:text="${t.fechaRegistro}"></td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>

<script th:inline="javascript">

    let pendientes = /*[[${pendientes}]]*/ 0;
    let proceso    = /*[[${proceso}]]*/ 0;
    let atendidos  = /*[[${atendidos}]]*/ 0;
    let cerrados   = /*[[${cerrados}]]*/ 0;

    const datos   = [pendientes, proceso, atendidos, cerrados];
    const colores = ['#d97706', '#3b82f6', '#10b981', '#94a3b8'];
    const opcionesBase = {
        responsive: true,
        maintainAspectRatio: false
    };

    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.color = '#475569';

    new Chart(
        document.getElementById('pieChart'),
        {
            type: 'doughnut',
            data: {
                labels: ['Pendiente', 'En Proceso', 'Atendido', 'Cerrado'],
                datasets: [{
                    data: datos,
                    backgroundColor: colores,
                    borderWidth: 2,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                ...opcionesBase,
                cutout: '60%',
                plugins: { legend: { position: 'bottom' } }
            }
        }
    );

    new Chart(
        document.getElementById('barChart'),
        {
            type: 'bar',
            data: {
                labels: ['Pendiente', 'Proceso', 'Atendido', 'Cerrado'],
                datasets: [{
                    label: 'Tickets',
                    data: datos,
                    backgroundColor: colores,
                    borderRadius: 4
                }]
            },
            options: {
                ...opcionesBase,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#e2e8f0' } },
                    x: { grid: { display: false } }
                }
            }
        }
    );

    new Chart(
        document.getElementById('histograma'),
        {
            type: 'bar',
            data: {
                labels: ['Pendiente', 'Proceso', 'Atendido', 'Cerrado'],
                datasets: [{
                    label: 'Cantidad',
                    data: datos,
                    backgroundColor: '#2563eb',
                    borderRadius: 4
                }]
            },
            options: {
                ...opcionesBase,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#e2e8f0' } },
                    x: { grid: { display: false } }
                }
            }
        }
    );

</script>

</body>
</html>
