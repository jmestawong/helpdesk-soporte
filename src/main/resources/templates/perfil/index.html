<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil</title>

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">

<div class="app-layout">

    <div th:replace="~{fragments/nav :: sidebar(${activo})}"></div>

    <div class="app-content">

        <div th:replace="~{fragments/nav :: topbar}"></div>

        <main class="page-content">

            <h2 class="mb-4">Mi Perfil</h2>

            <div th:if="${param.actualizado}" class="alert alert-success">
                Datos actualizados correctamente.
            </div>
            <div th:if="${param.passwordActualizada}" class="alert alert-success">
                Contraseña actualizada correctamente.
            </div>

            <div class="row">

                <div class="col-md-6 mb-4">

                    <div class="card ">
                        <div class="card-body">

                            <div class="d-flex align-items-center gap-3 mb-4">
                                <div class="user-avatar" style="width:64px;height:64px;font-size:1.5rem;"
                                     th:text="${#strings.substring(usuario.nombres,0,1) + #strings.substring(usuario.apellidos,0,1)}">
                                </div>
                                <div>
                                    <h5 class="mb-0" th:text="${usuario.nombres + ' ' + usuario.apellidos}"></h5>
                                    <span class="badge"
                                          th:classappend="${'badge-rol-' + #strings.toLowerCase(usuario.rol.nombreRol)}"
                                          th:text="${usuario.rol.nombreRol}">
                                    </span>
                                </div>
                            </div>

                            <h6 class="text-muted">Datos personales</h6>

                            <form th:action="@{/perfil/actualizar}" method="post">

                                <div class="mb-3">
                                    <label>Nombres</label>
                                    <input type="text" name="nombres" th:value="${usuario.nombres}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label>Apellidos</label>
                                    <input type="text" name="apellidos" th:value="${usuario.apellidos}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label>Correo</label>
                                    <input type="email" th:value="${usuario.correo}" class="form-control" disabled>
                                </div>

                                <button type="submit" class="btn btn-primary">
                                    Guardar cambios
                                </button>

                            </form>

                        </div>
                    </div>

                </div>

                <div class="col-md-6 mb-4">

                    <div class="card ">
                        <div class="card-body">

                            <h6 class="text-muted">Cambiar contraseña</h6>

                            <form th:action="@{/perfil/password}" method="post">

                                <div class="mb-3">
                                    <label>Nueva contraseña</label>
                                    <input type="password" name="passwordNueva" class="form-control" placeholder="Dejar en blanco para no cambiarla">
                                </div>

                                <button type="submit" class="btn btn-outline-primary">
                                    Actualizar contraseña
                                </button>

                            </form>

                        </div>
                    </div>

                </div>

            </div>

        </main>

    </div>

</div>

</body>
</html>
